version: '3'

services:
  dokuwiki:
    image: bitnami/dokuwiki:20200729
    #image: bitnami/dokuwiki:20180422
    environment:
        DOKUWIKI_USERNAME: 'superuser'
        DOKUWIKI_PASSWORD: 'bitnami1'
    ports:
        - "8080:8080"
    # user/pass = user/bitnami1

  composer:
    image: composer:2.10.2
    volumes:
      - ./:/app
    working_dir: /app
    command: help

